<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Invoice</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Create Invoice</h2>
        <form id="invoiceForm" action="/generate-pdf" method="post">
            <label for="invoiceNumber">Invoice Number</label>
            <input type="text" id="invoiceNumber" name="invoiceNumber" required>

            <label for="invoiceDate">Invoice Date</label>
            <input type="text" id="invoiceDate" name="invoiceDate" required>

            <label for="billTo">Bill To</label>
            <input type="text" id="billTo" name="billTo" required>

            <div id="items">
                <div class="item-entry">
                    <input type="text" name="itemDescription[]" placeholder="Item Description" required>
                    <input type="number" name="itemQuantity[]" placeholder="Quantity" required>
                    <input type="number" step="0.01" name="itemPrice[]" placeholder="Price" required>
                </div>
            </div>
            <button type="button" class="add-item" onclick="addItem()">Add Item</button>

            <button type="submit" class="submit-btn">Generate Invoice PDF</button>
        </form>
    </div>
    <script src="/static/js/script.js"></script>
</body>
</html>
